name: Verify PR

on:
  push:
    branches: [feat/unified-operator-global-workspace]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Operator bootstrap migration
        run: npm run test:operator:sql
      - name: PostgreSQL migrations and RLS — camera fixture
        run: npm run test:camera:sql
      - name: PostgreSQL migrations and RLS — live-location fixture
        run: npm run test:location:sql
      - name: Next.js production build
        run: npm run build
