name: Prepare shadcn preview lockfile

on:
  push:
    branches: [feat/shadcn-ui-foundation-preview]

permissions:
  contents: write

concurrency:
  group: shadcn-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(ui): update npm lockfile for shadcn"
          git push
